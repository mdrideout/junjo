name: junjo-ai-chat

services:
  backend:
    build:
      context: ../..
      dockerfile: examples/ai_chat/backend/Dockerfile
    init: true
    environment:
      - AI_CHAT_DATA_DIRECTORY=/data
      - AI_CHAT_CORS_ORIGINS=http://localhost:${AI_CHAT_FRONTEND_PORT:-26251}
      - AI_CHAT_MODEL_PROVIDER
      - AI_CHAT_GEMINI_TEXT_MODEL
      - AI_CHAT_GEMINI_IMAGE_MODEL
      - AI_CHAT_GROK_TEXT_MODEL
      - AI_CHAT_GROK_IMAGE_MODEL
      - AI_CHAT_PROVIDER_TIMEOUT_SECONDS
      - GEMINI_API_KEY
      - XAI_API_KEY
      - JUNJO_AI_STUDIO_API_KEY
      # The shared .env stays host-native for local evaluation runs.
      - JUNJO_AI_STUDIO_OTLP_ENDPOINT=host.docker.internal:26155
      - JUNJO_AI_STUDIO_OTLP_INSECURE
      - JUNJO_AI_STUDIO_FRONTEND_BASE_URL
      - WATCHFILES_FORCE_POLLING=true
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${AI_CHAT_BACKEND_PORT:-26252}:${AI_CHAT_BACKEND_PORT:-26252}
    command:
      - fastapi
      - dev
      - --entrypoint
      - ai_chat.main:app
      - --host
      - 0.0.0.0
      - --port
      - ${AI_CHAT_BACKEND_PORT:-26252}
    volumes:
      - ai-chat-data:/data
      - ../../src:/workspace/src
      - ./backend:/workspace/examples/ai_chat/backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:${AI_CHAT_BACKEND_PORT:-26252}/api/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    init: true
    environment:
      VITE_API_BASE_URL: http://localhost:${AI_CHAT_BACKEND_PORT:-26252}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
    ports:
      - ${AI_CHAT_FRONTEND_PORT:-26251}:${AI_CHAT_FRONTEND_PORT:-26251}
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - ${AI_CHAT_FRONTEND_PORT:-26251}
      - --strictPort
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:${AI_CHAT_FRONTEND_PORT:-26251}')
            .then(response => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  ai-chat-data:
