name: Studio REST API Contract

on:
  push:
    branches: [master]
    paths:
      - "apps/studio/backend/**"
      - "apps/studio/frontend/backend/openapi.json"
      - "apps/studio/frontend/src/**/*schema*.ts"
      - "apps/studio/frontend/src/__tests__/contracts/**"
      - ".github/workflows/studio-rest-api-contract-validation.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-rest-api-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      # The export builds the backend, whose build script compiles the protos.
      - name: Install protoc 30.2
        run: |
          PROTOC_VERSION=30.2
          PROTOC_SHA256="327e9397c6fb3ea2a542513a3221334c6f76f7aa524a7d2561142b67b312a01f"
          PROTOC_ARCHIVE="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl -fsSLO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ARCHIVE}"
          printf '%s  %s\n' "${PROTOC_SHA256}" "${PROTOC_ARCHIVE}" | sha256sum --check -
          sudo unzip -q -o "${PROTOC_ARCHIVE}" -d /usr/local bin/protoc 'include/*'
          rm "${PROTOC_ARCHIVE}"
          test "$(protoc --version)" = "libprotoc ${PROTOC_VERSION}"
      # Without a `toolchain` input the action installs the toolchain pinned by
      # the rust-toolchain.toml in `rust-src-dir`.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: apps/studio/backend
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/studio/frontend
        run: npm ci
      - name: Run schema validation pipeline
        working-directory: apps/studio/backend
        run: ./scripts/validate_rest_api_contracts.sh
      # The pipeline above rewrites the document from the backend binary. A
      # difference means the committed document is not what the backend serves.
      - name: Prove the committed OpenAPI document is the exported one
        run: git diff --exit-code -- apps/studio/frontend/backend/openapi.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "sdks/python/uv.lock"
      - name: Sync SDK dependencies
        working-directory: sdks/python
        run: uv sync --frozen --package junjo --extra dev
      - name: Run the SDK's Studio contract test
        working-directory: sdks/python
        run: uv run pytest -q tests/test_studio_openapi_contract.py
      - name: Upload OpenAPI schema on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-openapi-schema
          path: apps/studio/frontend/backend/openapi.json
          retention-days: 7
