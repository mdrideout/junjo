name: Studio Backend and Ingestion

on:
  push:
    branches: [master]
    paths:
      - "apps/studio/LICENSE"
      - "apps/studio/THIRD_PARTY_NOTICES.md"
      - "apps/studio/licenses/**"
      - "apps/studio/backend/**"
      - "apps/studio/ingestion/**"
      - "apps/studio/proto/**"
      - "contracts/telemetry/**"
      - "tooling/scripts/validate_studio_artifact_licenses.py"
      - ".github/workflows/studio-backend-tests.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - name: Install protoc 30.2
        run: |
          PROTOC_VERSION=30.2
          PROTOC_SHA256="327e9397c6fb3ea2a542513a3221334c6f76f7aa524a7d2561142b67b312a01f"
          PROTOC_ARCHIVE="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl -fsSLO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ARCHIVE}"
          printf '%s  %s\n' "${PROTOC_SHA256}" "${PROTOC_ARCHIVE}" | sha256sum --check -
          sudo unzip -q -o "${PROTOC_ARCHIVE}" -d /usr/local bin/protoc 'include/*'
          rm "${PROTOC_ARCHIVE}"
          test "$(protoc --version)" = "libprotoc ${PROTOC_VERSION}"
      # The backend suite builds the ingestion binary, which has no pinned
      # toolchain: it builds with stable, as the ingestion job does.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
      # The backend builds with the toolchain pinned by its rust-toolchain.toml.
      - name: Install the backend's pinned Rust toolchain
        working-directory: apps/studio/backend
        run: rustup show active-toolchain || rustup toolchain install
      - name: Run backend tests
        working-directory: apps/studio/backend
        run: |
          set -o pipefail
          cargo test --locked --message-format=short 2>&1 | tee /tmp/backend-test.log
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-backend-test-logs
          path: /tmp/backend-test.log
          retention-days: 7

  backend-lint:
    name: Backend Lint and Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/studio/backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      # Clippy runs the server's build script, which compiles the protos.
      - name: Install protoc 30.2
        run: |
          PROTOC_VERSION=30.2
          PROTOC_SHA256="327e9397c6fb3ea2a542513a3221334c6f76f7aa524a7d2561142b67b312a01f"
          PROTOC_ARCHIVE="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl -fsSLO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ARCHIVE}"
          printf '%s  %s\n' "${PROTOC_SHA256}" "${PROTOC_ARCHIVE}" | sha256sum --check -
          sudo unzip -q -o "${PROTOC_ARCHIVE}" -d /usr/local bin/protoc 'include/*'
          rm "${PROTOC_ARCHIVE}"
          test "$(protoc --version)" = "libprotoc ${PROTOC_VERSION}"
      # Without a `toolchain` input the action installs the toolchain pinned by
      # the rust-toolchain.toml in `rust-src-dir`.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: apps/studio/backend
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  ingestion-tests:
    name: Ingestion Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/studio/ingestion
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - name: Install protoc 30.2
        run: |
          PROTOC_VERSION=30.2
          PROTOC_SHA256="327e9397c6fb3ea2a542513a3221334c6f76f7aa524a7d2561142b67b312a01f"
          PROTOC_ARCHIVE="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl -fsSLO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ARCHIVE}"
          printf '%s  %s\n' "${PROTOC_SHA256}" "${PROTOC_ARCHIVE}" | sha256sum --check -
          sudo unzip -q -o "${PROTOC_ARCHIVE}" -d /usr/local bin/protoc 'include/*'
          rm "${PROTOC_ARCHIVE}"
          test "$(protoc --version)" = "libprotoc ${PROTOC_VERSION}"
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
      - name: Run ingestion tests
        run: cargo test --locked --message-format=short
      # Checks the backend and ingestion inventories in one run.
      - name: Validate production dependency license closure
        run: |
          python3 ../../../tooling/scripts/validate_studio_artifact_licenses.py \
            check \
            --with-cargo-metadata

  ingestion-benchmark-tests:
    name: Ingestion Benchmark Harness Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "apps/studio/ingestion/benchmarks/uv.lock"
      - name: Validate benchmark delivery accounting
        working-directory: apps/studio/ingestion/benchmarks
        run: uv run --locked pytest -q test_delivery.py
