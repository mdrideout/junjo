# Whole-stack single-CPU profile: both services share one virtual CPU and have
# no individual CPU quota. Memory limits and no-swap are unchanged.
services:
  backend:
    image: junjo-rsmig-python-backend:0.85.0
    cpuset: "0"
    cpus: 0
    volumes: !override
      - ${JUNJO_HOST_DB_DATA_PATH}:/app/.dbdata
    environment:
      # The Python backend's own settings. The benchmark Compose file no longer
      # carries them, because the Rust backend has none of them.
      RUN_MIGRATIONS: "true"
      JUNJO_SESSION_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      JUNJO_SECURE_COOKIE_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      JUNJO_LOG_LEVEL: warning
  ingestion:
    image: junjo-rsmig-ingestion:0.85.0
    cpuset: "0"
    cpus: 0
    volumes: !override
      - ${JUNJO_HOST_DB_DATA_PATH}:/app/.dbdata
  auth-proxy:
    image: junjo-rsmig-auth-proxy:local
