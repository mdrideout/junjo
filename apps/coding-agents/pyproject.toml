[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "junjo-coding-agents"
version = "0.1.0"
description = "Run Junjo workflows with coding agents and export scoped execution evidence."
readme = "README.md"
requires-python = ">=3.11.9,!=3.12.0,!=3.12.1,!=3.12.2"
license = "Apache-2.0"
dependencies = ["junjo==0.68.0", "mcp>=1.26,<2", "uvicorn>=0.35", "python-dotenv>=1.1"]

[project.scripts]
junjo-coding-agents = "junjo_coding_agents.server:main"

[dependency-groups]
dev = ["httpx", "pytest", "pytest-asyncio", "ruff", "ty"]

[tool.uv.sources]
junjo = { path = "../../sdks/python", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
